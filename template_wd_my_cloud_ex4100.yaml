zabbix_export:
  version: '6.0'
  date: '2021-11-21T21:38:11Z'
  groups:
    -
      uuid: 414f26ba462647cb88c9671a129d05ad
      name: Templates
  templates:
    -
      uuid: 17b08faf85814466af9a4cdce08aef5c
      template: 'WD My Cloud EX4100'
      name: 'WD My Cloud EX4100'
      description: |
        ## Overview
        
        Zabbix SNMP Template for (Western Digital) WD My Cloud EX4100
        
        
        In WD My Cloud EX4100 is simple (MIBs here http://downloads.wdc.com/nas/WDMYCLOUDEX4-MIB.txt). 
        
        
        Because some OID return not-clear-byte values (150.3G, 2.3T) - in items used "regex-magic". Loosing some precision (i try to beat this problem), for flexiable data:
        
        
        Prerequisites:
        --------------
        
        
        * Enable SNMP on WD My Cloud EX4100
        * Zabbix 3.4+ with preproccessing support for regex-magic on item
        
        
        Feautres:
        ---------
        
        
        Low Level Discovery:
        
        
        * physical disks
        * logical disks
        * UPS
        
        
        Notice:
        -------
        
        
        In my env this NAS is "lazy" and have problems with BULK SNMP queries from Zabbix.
        
        
        Template uses vars set on host-level:
        
        
        * {$SNMP\_PORT}
        * {$SNMP\_COMMUNITY}
        
        
        
      groups:
        -
          name: Templates
      items:
        -
          uuid: aa2917856d7e4880b55357d5f1266d41
          name: 'Agent Version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.1.0
          key: agentVer
          delay: 1h
          history: 30d
          trends: '0'
          value_type: TEXT
          tags:
            -
              tag: Application
              value: System
        -
          uuid: 53bbbb33174e42d4b2acb0f2e9210034
          name: 'Fan status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.8.0
          key: fanStatus
          history: 30d
          trends: '0'
          value_type: TEXT
          preprocessing:
            -
              type: LTRIM
              parameters:
                - ' fan0: '
            -
              type: LTRIM
              parameters:
                - ' fan1: '
          tags:
            -
              tag: Application
              value: System
          triggers:
            -
              uuid: 24dfee4d3ded470b8d3106fff3a6c165
              expression: 'find(/WD My Cloud EX4100/fanStatus,,"regexp","running")=0'
              name: 'Fan status'
              priority: WARNING
        -
          uuid: c22b7b34b4b246319de3d0f702ac3a3e
          name: 'FTP status'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.5.0
          key: ftpServer
          delay: 1h
          history: 1w
          trends: 30d
          valuemap:
            name: 'WD My Cloud EX4100 FTP Server'
          tags:
            -
              tag: Application
              value: System
        -
          uuid: a1229bd010a6445aa3c72101b4fbf5f7
          name: Hostname
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.3.0
          key: hostName
          delay: 1h
          history: 30d
          trends: '0'
          value_type: TEXT
          tags:
            -
              tag: Application
              value: System
        -
          uuid: a6c093a1671f439b9107ef16c46594f5
          name: 'Net type'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.6.0
          key: netType
          delay: 1h
          history: 1w
          trends: 30d
          valuemap:
            name: 'WD My Cloud EX4100 Net Type'
          tags:
            -
              tag: Application
              value: System
        -
          uuid: a900ed286046489e8d638a76cf1d9b57
          name: 'Software version'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.2.0
          key: softwareVersion
          delay: 1h
          history: 30d
          trends: '0'
          value_type: TEXT
          tags:
            -
              tag: Application
              value: System
        -
          uuid: 4fa4a6d9df3b4daba72d7d766c78520c
          name: Temperature
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.4.1.5127.1.1.1.6.1.7.0
          key: temperature
          history: 1w
          trends: 30d
          preprocessing:
            -
              type: LTRIM
              parameters:
                - 'Centigrade:'
            -
              type: REGEX
              parameters:
                - '^\d{1,2}'
                - \0
          tags:
            -
              tag: Application
              value: System
          triggers:
            -
              uuid: 079cdfe5bf52442cbcd291c1dd5ca07a
              expression: 'avg(/WD My Cloud EX4100/temperature,#5)>60'
              name: 'High temperature'
              priority: WARNING
      discovery_rules:
        -
          uuid: b8c989ab0e57436b9c94bbc04e0c05e8
          name: 'Logical Disks'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.5127.1.1.1.6.1.9.1.1, {#VOLUMENAME}, .1.3.6.1.4.1.5127.1.1.1.6.1.9.1.2]'
          key: ldDiscovery
          item_prototypes:
            -
              uuid: c7f42cef0d4c4ad4966e6d11021da09f
              name: 'Logical disk {#VOLUMENAME} free space'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.9.1.6.{#SNMPINDEX}'
              key: 'ld.freespace[{#VOLUMENAME}]'
              history: 30d
              trends: 90d
              units: B
              preprocessing:
                -
                  type: REGEX
                  parameters:
                    - '(\d{1,}).(\d{0,})([GT])'
                    - '\1.\2\3:G=\1.\2:T=\1\200'
                -
                  type: REGEX
                  parameters:
                    - '(G|T)(?=.*:\1=(\d{1,}))'
                    - \2
                -
                  type: MULTIPLIER
                  parameters:
                    - '1073741824'
              tags:
                -
                  tag: Application
                  value: 'Logical Disks'
            -
              uuid: e5e08a966c89450981a03e4cdb6b4844
              name: 'Logical disk {#VOLUMENAME} FS type'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.9.1.3.{#SNMPINDEX}'
              key: 'ld.fstype[{#VOLUMENAME}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: 'Logical Disks'
            -
              uuid: 3596c80980ae47ecbbaa8a205daacec8
              name: 'Logical disk {#VOLUMENAME} free percent'
              type: CALCULATED
              key: 'ld.pfree[{#VOLUMENAME}]'
              history: 30d
              trends: 90d
              units: '%'
              params: '100*last(//ld.freespace[{#VOLUMENAME}])/last(//pd.size[{#VOLUMENAME}])'
              tags:
                -
                  tag: Application
                  value: 'Logical Disks'
              trigger_prototypes:
                -
                  uuid: e9b3409f682c4ccc8bdb3482086c642f
                  expression: 'last(/WD My Cloud EX4100/ld.pfree[{#VOLUMENAME}])<25'
                  name: 'Logical Disk {#VOLUMENAME} free space less 25%'
                  priority: WARNING
            -
              uuid: edfa70d3a32641b7afc844dc44cc28b2
              name: 'Logical disk {#VOLUMENAME} RAID level'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.9.1.4.{#SNMPINDEX}'
              key: 'ld.raid[{#VOLUMENAME}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: 'Logical Disks'
            -
              uuid: 5322ef6843784564a11505307df553e4
              name: 'Logical disk {#VOLUMENAME} size'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.9.1.5.{#SNMPINDEX}'
              key: 'pd.size[{#VOLUMENAME}]'
              delay: 1h
              history: 30d
              trends: 90d
              units: B
              preprocessing:
                -
                  type: REGEX
                  parameters:
                    - '(\d{1,}).(\d{0,})([GT])'
                    - '\1.\2\3:G=\1.\2:T=\1\200'
                -
                  type: REGEX
                  parameters:
                    - '(G|T)(?=.*:\1=(\d{1,}))'
                    - \2
                -
                  type: MULTIPLIER
                  parameters:
                    - '1073741824'
              tags:
                -
                  tag: Application
                  value: 'Logical Disks'
        -
          uuid: e8c8f0e14f8647839855c8e45ba183e2
          name: 'Physical Disks'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.1]'
          key: pdDiscovery
          delay: 1h
          item_prototypes:
            -
              uuid: 16cd05313e714e67a4e93f9461464134
              name: 'Disk capacity in slot {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.6.{#SNMPINDEX}'
              key: 'pd.capacity[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: 90d
              units: B
              preprocessing:
                -
                  type: RTRIM
                  parameters:
                    - ' GB.'
                -
                  type: MULTIPLIER
                  parameters:
                    - '1073741824'
              tags:
                -
                  tag: Application
                  value: 'Physical Disks'
            -
              uuid: 92af029d1039427fb7e352cde306b7e9
              name: 'Disk model in slot {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.3.{#SNMPINDEX}'
              key: 'pd.model[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: 'Physical Disks'
            -
              uuid: 9d21a68cf034414bb48644c0010eaecf
              name: 'Disk SN in slot {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.4.{#SNMPINDEX}'
              key: 'pd.SN[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: 'Physical Disks'
            -
              uuid: 2dbc4f449e5542f3928851991bad8216
              name: 'Disk temperature in slot {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.5.{#SNMPINDEX}'
              key: 'pd.temperature[{#SNMPINDEX}]'
              history: 30d
              trends: 90d
              preprocessing:
                -
                  type: LTRIM
                  parameters:
                    - 'Centigrade:'
              tags:
                -
                  tag: Application
                  value: 'Physical Disks'
              trigger_prototypes:
                -
                  uuid: b226ecdb834e4306bcb6025b696305c4
                  expression: 'avg(/WD My Cloud EX4100/pd.temperature[{#SNMPINDEX}],#5)>55'
                  name: 'Physical disk {#SNMPINDEX} temperature'
                  priority: WARNING
            -
              uuid: a0c0cf8f8d0f4cd0b3967d1b8fc3c821
              name: 'Disk vendor in slot {#SNMPINDEX}'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.10.1.2.{#SNMPINDEX}'
              key: 'pd.Vendor[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: 'Physical Disks'
        -
          uuid: 98b3e1e4cda04d00839207dfb4d7d563
          name: UPSs
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SNMPVALUE},.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.1]'
          key: upsDiscovery
          delay: 1h
          item_prototypes:
            -
              uuid: 7f3534a746494b4a8e91a25a2e7648fb
              name: 'UPS No{#SNMPINDEX} Battery Charge'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.5.{#SNMPINDEX}'
              key: 'upsBattery[{#SNMPINDEX}]'
              history: 30d
              trends: 90d
              value_type: FLOAT
              units: '%'
              preprocessing:
                -
                  type: RTRIM
                  parameters:
                    - ' %'
              tags:
                -
                  tag: Application
                  value: UPS
              trigger_prototypes:
                -
                  uuid: 35d432c9097a475d8fe0e09e60cc31b2
                  expression: 'last(/WD My Cloud EX4100/upsBattery[{#SNMPINDEX}])<25'
                  name: 'Battery Charge Critical'
                  priority: HIGH
                -
                  uuid: 26099f61593e42a7954010d46e99c332
                  expression: 'last(/WD My Cloud EX4100/upsBattery[{#SNMPINDEX}])<50'
                  name: 'Battery Charge Low'
                  priority: AVERAGE
            -
              uuid: b19a809fa51242638fe2c67b1cf127af
              name: 'UPS No{#SNMPINDEX} Manufacturer'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.3.{#SNMPINDEX}'
              key: 'upsManufacturer[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: UPS
            -
              uuid: ad636bc5f43a42f88dd33a672762a161
              name: 'UPS No{#SNMPINDEX} Mode'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.2.{#SNMPINDEX}'
              key: 'upsMode[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: UPS
            -
              uuid: 99dc67f499c04c97a14d9eeac57016be
              name: 'UPS No{#SNMPINDEX} Product'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.4.{#SNMPINDEX}'
              key: 'upsProduct[{#SNMPINDEX}]'
              delay: 1h
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: UPS
            -
              uuid: ae8e073911ee4d80b02a83870fb774d0
              name: 'UPS No{#SNMPINDEX} Status'
              type: SNMP_AGENT
              snmp_oid: '.1.3.6.1.4.1.5127.1.1.1.6.1.11.1.6.{#SNMPINDEX}'
              key: 'upsStatus[{#SNMPINDEX}]'
              history: 30d
              trends: '0'
              value_type: TEXT
              tags:
                -
                  tag: Application
                  value: UPS
              trigger_prototypes:
                -
                  uuid: e00fe288e9dc4c25bf39ae209f5401fe
                  expression: 'find(/WD My Cloud EX4100/upsStatus[{#SNMPINDEX}],#3,"regexp","On Line")=0'
                  name: 'Battery Status'
                  priority: WARNING
      valuemaps:
        -
          uuid: 359ac9383ca749c59b60b2b93b8a6edf
          name: 'WD My Cloud EX4100 FTP Server'
          mappings:
            -
              value: '0'
              newvalue: disabled
            -
              value: '1'
              newvalue: enabled
        -
          uuid: 48b013810d5d4cdcb3aa545a4d47204a
          name: 'WD My Cloud EX4100 Net Type'
          mappings:
            -
              value: '0'
              newvalue: Workgroup
            -
              value: '1'
              newvalue: 'Active Directory'
